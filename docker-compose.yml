services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meowpay
      POSTGRES_USER: meowpay
      POSTGRES_PASSWORD: meowpay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowpay -d meowpay"]
      interval: 2s
      timeout: 5s
      retries: 20
    # Do not publish 5432. The API reaches Postgres on the Compose network.

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meowpay
      SPRING_DATASOURCE_USERNAME: meowpay
      SPRING_DATASOURCE_PASSWORD: meowpay
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
